<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sakaniwa-dev — アプリ</title>
<meta name="robots" content="noindex">
<link rel="icon" href="zanki/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
  /* 残機の紹介ページ（zanki/index.html）と同じ世界観。黄緑×墨で固定し、ダークは持たない。 */
  :root {
    color-scheme: light;
    --lime: #E0F352;
    --ink: #191E27;
    --ink-soft: #3A4150;
    --paper: #F7F9E8;
    --card: #FFFFFF;
    --heart: #F0525A;
    --mute: #6B7280;

    --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
    --f-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    --f-pixel: "DotGothic16", ui-monospace, "Osaka-Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--lime); color: var(--ink);
    font-family: var(--f-body); font-size: 16px; line-height: 1.8;
    -webkit-font-smoothing: antialiased; overflow-x: clip;
    background-image: radial-gradient(color-mix(in srgb, var(--ink) 13%, transparent) 1.2px, transparent 1.4px);
    background-size: 22px 22px;
  }
  img { max-width: 100%; height: auto; display: block; }
  :focus-visible { outline: 3px solid var(--heart); outline-offset: 3px; border-radius: 8px; }

  .wrap { max-width: 640px; margin-inline: auto; padding-inline: clamp(16px, 5vw, 32px); padding-block: clamp(56px, 12vw, 120px) 48px; }
  .eyebrow { font: 14px/1 var(--f-pixel); letter-spacing: .14em; display: inline-flex; align-items: center; gap: 8px; }
  .eyebrow::before { content: ""; width: 10px; height: 10px; background: var(--heart); box-shadow: 2px 2px 0 var(--ink); }
  h1 { font: 400 clamp(56px, 13vw, 96px)/1 var(--f-display); letter-spacing: -.02em; margin: 16px 0 0; display: flex; align-items: center; gap: .18em; }
  h1 .hearts { display: inline-flex; gap: 6px; }
  h1 .hearts i { width: .32em; height: .3em; background: var(--heart); clip-path: polygon(0 15%,15% 15%,15% 0,43% 0,43% 15%,57% 15%,57% 0,85% 0,85% 15%,100% 15%,100% 57%,85% 57%,85% 72%,71% 72%,71% 86%,57% 86%,57% 100%,43% 100%,43% 86%,29% 86%,29% 72%,15% 72%,15% 57%,0 57%); }
  .lead { margin: 16px 0 0; font-weight: 500; color: var(--ink-soft); }

  .app {
    display: block; margin-top: 40px; background: var(--card); color: inherit; text-decoration: none;
    border: 2.5px solid var(--ink); border-radius: 28px; box-shadow: 8px 8px 0 var(--ink);
    overflow: hidden; transition: transform .2s cubic-bezier(.3, 1.5, .5, 1), box-shadow .2s;
  }
  .app:hover { transform: translate(-3px, -3px) rotate(-.5deg); box-shadow: 11px 11px 0 var(--ink); }
  .app:active { transform: translate(4px, 4px); box-shadow: 4px 4px 0 var(--ink); }
  .app-top { display: flex; align-items: center; gap: 18px; padding: clamp(20px, 4vw, 28px); }
  .app-top img { width: 72px; height: 72px; border-radius: 18px; border: 2.5px solid var(--ink); flex: none; }
  .nm { font: 400 clamp(26px, 5vw, 34px)/1.2 var(--f-display); margin: 0; }
  .nm span { font: 14px/1 var(--f-pixel); letter-spacing: .14em; color: var(--mute); margin-left: 8px; vertical-align: middle; }
  .ds { font-weight: 700; margin: 6px 0 0; color: var(--ink-soft); }
  .app-art { background: var(--paper); border-top: 2.5px solid var(--ink); display: flex; justify-content: center; align-items: flex-end; gap: 4%; padding: 20px 20px 0; height: 150px; overflow: hidden; }
  .app-art img { width: 22%; max-width: 110px; filter: drop-shadow(0 10px 8px rgba(40, 50, 0, .18)); }
  .app-art img:nth-child(2) { margin-bottom: 24px; }
  @media (prefers-reduced-motion: no-preference) {
    .app-art img { animation: bob 3.4s ease-in-out infinite; }
    .app-art img:nth-child(2) { animation-delay: -1.1s; }
    .app-art img:nth-child(3) { animation-delay: -2.2s; }
  }
  @keyframes bob { 50% { transform: translateY(-10px); } }
  .app-cta { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px clamp(20px, 4vw, 28px); background: var(--ink); color: var(--lime); font: 800 15px/1.2 var(--f-body); }
  .app-cta span:last-child { font-family: var(--f-pixel); font-size: 18px; }

  .sub { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .sub a {
    font: 800 14px/1 var(--f-body); text-decoration: none; color: var(--ink);
    padding: 12px 18px; border-radius: 999px; background: var(--card);
    border: 2.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); transition: transform .12s, box-shadow .12s;
  }
  .sub a.dark { background: var(--ink); color: var(--lime); box-shadow: 3px 3px 0 var(--heart); }
  .sub a:hover { transform: translate(-1px, -1px); }
  .sub a:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }

  footer { margin-top: 64px; font: 12px/1.6 var(--f-pixel); letter-spacing: .08em; color: var(--ink-soft); }
</style>
</head>
<body>
<main class="wrap">
  <span class="eyebrow">SAKANIWA-DEV</span>
  <h1>APPS <span class="hearts" aria-hidden="true"><i></i><i></i><i></i></span></h1>
  <p class="lead">学生がつくって、学生が使うアプリ。</p>

  <a class="app" href="zanki/">
    <div class="app-top">
      <img src="zanki/assets/icon.png" alt="" width="72" height="72">
      <div>
        <p class="nm">残機<span>ZANKI</span></p>
        <p class="ds">あと何回休めるか、それだけ。</p>
      </div>
    </div>
    <div class="app-art" aria-hidden="true">
      <img src="zanki/assets/heart1.webp" alt="" width="328" height="303">
      <img src="zanki/assets/heart2.webp" alt="" width="327" height="303">
      <img src="zanki/assets/heart3.webp" alt="" width="327" height="303">
    </div>
    <div class="app-cta"><span>紹介ページを見る</span><span>▶</span></div>
  </a>

  <p class="sub">
    <a class="dark" href="https://apps.apple.com/jp/app/id6804644002">App Store で入手</a>
    <a href="zanki/support/">サポート・プライバシーポリシー</a>
  </p>

  <footer>© 2026 Hikaru Sakaniwa</footer>
</main>
</body>
</html>
