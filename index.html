<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sakaniwa-dev — アプリ</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#EAEBEE;--surf:#FFFFFF;--line:#D2D6DD;--ink:#13171C;--ink-2:#49515C;--ink-3:#79828F}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1216;--surf:#181D24;--line:#262D37;--ink:#EDF1F6;--ink-2:#A3AEBC;--ink-3:#6F7B8A}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center}
.wrap{max-width:560px;margin:0 auto;padding:48px clamp(20px,5vw,32px)}
h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.16em;color:var(--ink-3)}
.app{display:flex;align-items:center;gap:16px;margin-top:28px;padding:20px 22px;
  background:var(--surf);border:1px solid var(--line);border-radius:18px;text-decoration:none;color:inherit}
.app:hover{border-color:var(--ink-3)}
.app img{width:52px;height:52px;border-radius:13px;flex:0 0 auto}
.app .nm{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.app .ds{font-size:14px;color:var(--ink-2);margin:2px 0 0}
.sub{margin:14px 2px 0;font-size:14px}
.sub a{color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap">
  <h1>APPS</h1>
  <a class="app" href="zanki/">
    <img src="zanki/assets/icon.png" alt="">
    <span>
      <p class="nm">残機 (ZANKI)</p>
      <p class="ds">あと何回休めるか、それだけ。</p>
    </span>
  </a>
  <p class="sub"><a href="zanki/support/">サポート・プライバシーポリシー</a></p>
</div>
</body>
</html>
